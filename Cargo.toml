[workspace]
resolver = "3"
members = ["crates/lithium","crates/prometheum"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = [
    "csh <csh@smrkn.com>"
]
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

thiserror = "2.0"
tracing = "0.1"
anyhow = "1.0"
